[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronnext"
version = "1.1.0"
description = "Validate and explain cron expressions and whole crontabs, list next runs, time zones and run-frequency summary. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["cron", "crontab", "scheduler", "devops"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/cronnext"

[project.scripts]
cronnext = "cronnext:main"

[tool.setuptools]
py-modules = ["cronnext"]
